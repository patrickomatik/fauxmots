<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300">
  <!-- Definitions -->
  <defs>
    <!-- Gradients -->
    <linearGradient id="envelope-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4776E6" />
      <stop offset="100%" stop-color="#8E54E9" />
    </linearGradient>
    
    <linearGradient id="flask-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c6ff" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>
    
    <linearGradient id="liquid-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1CD8D2" />
      <stop offset="100%" stop-color="#93EDC7" />
    </linearGradient>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Background (transparent) -->
  <rect width="500" height="300" fill="white" opacity="0" />
  
  <!-- Main logo container -->
  <g transform="translate(250, 140)">
    <!-- Envelope -->
    <g>
      <!-- Envelope body -->
      <rect x="-75" y="-50" width="150" height="100" rx="8" fill="url(#envelope-gradient)" filter="url(#shadow)" />
      
      <!-- Envelope flap -->
      <path d="M-75,-50 L0,-10 L75,-50" fill="#6752d4" />
      
      <!-- @ symbol -->
      <text x="-30" y="20" font-family="Arial, sans-serif" font-size="60" font-weight="bold" text-anchor="middle" fill="white">@</text>
    </g>
    
    <!-- Laboratory Flask - superimposed on the right side of the envelope -->
    <g transform="translate(40, 0) scale(0.9)">
      <!-- Flask neck -->
      <rect x="-10" y="-50" width="20" height="30" rx="2" fill="url(#flask-gradient)" />
      
      <!-- Flask top rim -->
      <rect x="-15" y="-50" width="30" height="8" rx="3" fill="url(#flask-gradient)" />
      
      <!-- Flask body -->
      <path d="M-10,-20 L-30,40 C-30,45 30,45 30,40 L10,-20" fill="url(#flask-gradient)" />
      
      <!-- Liquid in flask -->
      <path d="M-25,20 L-28,40 C-28,43 28,43 28,40 L25,20" fill="url(#liquid-gradient)" />
      
      <!-- Bubbles in flask -->
      <circle cx="-10" cy="30" r="4" fill="white" opacity="0.7" />
      <circle cx="5" cy="25" r="3" fill="white" opacity="0.7" />
      <circle cx="12" cy="35" r="2" fill="white" opacity="0.7" />
    </g>
  </g>
  
  <!-- Text "FAUXMOTS" -->
  <g transform="translate(250, 230)">
    <text x="0" y="0" font-family="'Arial', sans-serif" font-size="42" font-weight="bold" text-anchor="middle" fill="#333">FAUXMOTS</text>
    <text x="0" y="25" font-family="'Arial', sans-serif" font-size="16" text-anchor="middle" fill="#666">SMTP TEST SERVER</text>
  </g>
</svg>